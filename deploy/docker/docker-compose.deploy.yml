# ============================================================
# PM 系统【服务器专用】编排文件（离线部署：只 load，不 build）
#
# 与仓库内 docker-compose.yml 的区别：本文件【没有 build 段】，
# 因此运行目录里不需要任何源码——只要有：
#   ① 本文件（改名为 docker-compose.yml）
#   ② 同目录的 .env
#   ③ 已 docker load 进来的镜像（pm-backend:<IMAGE_TAG> / pm-frontend:<IMAGE_TAG>）
#
# 启动： cd <运行目录> && docker compose up -d
# 说明： pull_policy: never 表示只用本机已有镜像；若未 load 会立刻报错，
#        不会去联网拉取、也不会误触发构建（服务器无外网场景的关键保护）。
# 数据库为外部崖山 YashanDB（Oracle 模式）主备集群，不在本编排内；
# 通过 .env 的 YASHAN_* 注入连接信息（见 .env.example）。
# ============================================================
services:
  backend:
    image: pm-backend:${IMAGE_TAG:-latest}
    pull_policy: never
    container_name: pm-backend
    restart: unless-stopped
    environment:
      # 时区（政务系统日期敏感；容器默认 UTC 会导致时间差 8 小时）
      TZ: ${TZ:-Asia/Shanghai}
      # JVM 参数（内存上限 + 时区，防长期运行内存膨胀；可用 .env 覆盖）
      JAVA_TOOL_OPTIONS: "${JAVA_TOOL_OPTIONS:--Xms256m -Xmx512m -Duser.timezone=Asia/Shanghai}"
      # 崖山主备（驱动级 primary + TAF），URL 含 ? & 需加引号
      SPRING_DATASOURCE_URL: "jdbc:yasdb:primary://${YASHAN_MASTER_IP:-10.254.212.106}:1688,${YASHAN_STANDBY_IP:-10.254.212.107}:1688/${YASHAN_DB:-project_manager}?poolTimeout=60&failover=on&failoverType=session&failoverMethod=basic&failoverRetries=5&failoverDelay=2"
      SPRING_DATASOURCE_USERNAME: ${YASHAN_USER:-pm}
      SPRING_DATASOURCE_PASSWORD: ${YASHAN_PASSWORD:?必须在 .env 中设置 YASHAN_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-please-change-this-jwt-secret-in-production-0123456789}
      UPLOAD_DIR: /uploads
      # 附件存储：生产统一 obs（华为 OBS，对象置于桶内 uploads/ 前缀下）
      APP_STORAGE_TYPE: ${APP_STORAGE_TYPE:-local}
      APP_STORAGE_OBS_ENDPOINT: ${APP_STORAGE_OBS_ENDPOINT:-}
      APP_STORAGE_OBS_BUCKET: ${APP_STORAGE_OBS_BUCKET:-}
      APP_STORAGE_OBS_AK: ${APP_STORAGE_OBS_AK:-}
      APP_STORAGE_OBS_SK: ${APP_STORAGE_OBS_SK:-}
      APP_STORAGE_OBS_PREFIX: ${APP_STORAGE_OBS_PREFIX:-uploads}
    volumes:
      # 附件存储：默认本地命名卷 pm_uploads（单机）。
      # 用 OBS 时该卷仅作过场，不会写入实际附件；双机 + local 时才需共享目录：
      #   UPLOAD_VOLUME=/mnt/pm-uploads   （两机 .env 配同一共享挂载点）
      - ${UPLOAD_VOLUME:-pm_uploads}:/uploads
    expose:
      - "8080"
    healthcheck:
      # 容器内无 curl，用 bash /dev/tcp 探测端口
      test: ["CMD-SHELL", "timeout 2 bash -c '</dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    logging:
      # 限制容器日志体积，防长期运行打满磁盘（无外网服务器尤为重要）
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  frontend:
    image: pm-frontend:${IMAGE_TAG:-latest}
    pull_policy: never
    container_name: pm-frontend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    depends_on:
      backend:
        # 后端健康后再起前端，避免启动瞬间 502
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  pm_uploads:
