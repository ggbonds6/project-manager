server:
  port: ${AI_PORT:8100}
  # 与 Python 版一致：上传可达 500MB（附件里有大 PDF 与扫描件）
  tomcat:
    max-swallow-size: -1

spring:
  application:
    name: pm-ai-service
  # 本机开发把凭据写在 ai-backend/.env（不入库，见 .gitignore）——与 Python 版同一套变量名，
  # 运维不用改脚本。[.properties] 是告诉 Spring 按 properties 解析这个文件（KEY=VALUE 两种格式通用）；
  # optional: 表示文件不存在也不报错（生产直接用真实环境变量/容器 env）。
  # ⚠️ 路径是**相对进程工作目录**的：从仓库根起 jar 时 `./.env` 会落空（表现为平台全 401 missing api key，
  #    而服务照常启动）。所以两个位置都试：cwd/.env（在 ai-backend 里起）与 cwd/ai-backend/.env（仓库根起）。
  # 优先级：OS 环境变量 > .env（容器注入的变量会覆盖本机文件）。
  config:
    import: optional:file:./.env[.properties],optional:file:./ai-backend/.env[.properties]
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 600MB
  jackson:
    default-property-inclusion: non_null

# AI 服务配置：默认值都在 AiSettings 里，这里只做"环境变量 → 配置"的映射，
# 键名与 Python 版保持一致，便于平滑切换（同样的 .env 两边都能读）。
ai:
  work-dir: ${WORK_DIR:./work}
  gateway:
    base-url: ${LLM_BASE_URL:http://10.254.208.35:8090/v1}
    api-key: ${LLM_API_KEY:}
    # ⚠️ 2026-10-10 起它只是**兜底值**：四类模型各有自己的超时（见下面的 ai.limits），
    #    只有"未分级"的调用才会回落到它。chat 走 150s，不再是 300s。
    timeout-seconds: ${LLM_TIMEOUT:300}
  llm:
    model: ${LLM_MODEL:Qwen3.8-27B-W8A8}
    max-input-chars: ${LLM_MAX_INPUT_CHARS:20000}
    max-tokens: ${LLM_MAX_TOKENS:16384}
    enable-thinking: ${LLM_ENABLE_THINKING:false}
  ocr:
    # 平台 OCR 地址默认复用网关（同一个网关、同一把 sk）
    model: ${OCR_MODEL:PaddleOCR-VL-1.6-0.9B}
    timeout-seconds: ${OCR_TIMEOUT:600}
    # ⚠️ 语义已修正（P0-4）：这是**全进程**的 OCR 在飞请求上限（全进程共享一个线程池），
    #    不再是"每份文档内 min(12, ceil(页数/8))"（那对 8 页文档是死配置）。
    concurrency: ${OCR_CONCURRENCY:12}
    # 单个请求的页数**上限**（平台建议 ≤16）；实际批页 = min(它, ceil(页数 / 在飞上限))，
    # 所以页数少的文档会自动切成更小的批次，把并发用起来。
    batch-pages: ${OCR_BATCH_PAGES:8}
    seal: ${OCR_SEAL:false}
    seal-min-pixels: ${OCR_SEAL_MIN_PIXELS:400000}
    platform-dpi: ${OCR_PLATFORM_DPI:150}
    platform-format: ${OCR_PLATFORM_FORMAT:jpeg}
    platform-quality: ${OCR_PLATFORM_QUALITY:85}
  vec:
    embed-model: ${VEC_EMBED_MODEL:Qwen3-VL-Embedding-8B}
    rerank-model: ${VEC_RERANK_MODEL:Qwen3-VL-Reranker-8B}
    # 0 = 不传维度（平台默认 4096；本部署不支持 MRL 降维）
    dimensions: ${VEC_EMBED_DIMENSIONS:0}
  retrieval:
    # 召回条数 = 送进 Reranker 的候选数（每次检索 ≈ 1.5 × recall，一次问答 ≈ 2 次检索）。
    # 耗时口径：平台重排实测 24 对/s ⇒ recall=50 时 ≈75 对/次 ≈3.1s、≈6.3s/问，
    # 把问答上限压到 ≈0.16 QPS；降到 20~25 可到 ≈0.4 QPS（约 2.5×）。
    # ⚠️ 默认保持 50：降配会动答案质量，必须先评测（见 recall-mode 的说明）。
    recall: ${RETRIEVAL_RECALL:50}
    # 召回档位（P0-7 的"便于后续降配"开关）：baseline（默认，用 recall）| low（用 recall-low）| custom。
    # ⚠️ 把默认改成 low/25 之前，必须先用 eval/smoke-30.json 跑降配前后对比，
    #    **引用命中率与数字一致率都不下降**才允许改（口径见 docs/AI模型调用与任务队列评估.md §6.1 P0-2）。
    recall-mode: ${RETRIEVAL_RECALL_MODE:baseline}
    # recall-mode=low 时使用的召回条数（P0-2 建议区间 20~25）。
    recall-low: ${RETRIEVAL_RECALL_LOW:25}
    top-k: ${RETRIEVAL_TOP_K:5}
    # local = 进程内余弦 + JSON 向量缓存（零部署、可随时回滚）；opensearch = 正式选型（真集群）。
    backend: ${VEC_BACKEND:local}
  # OpenSearch 向量后端（VEC_BACKEND=opensearch 时生效）。
  # ⚠️ URL 必须指向**实际作为生产的那一台**：两台机器（.110/.111）各自是**独立的单节点集群**
  #    （discovery.type: single-node，数据集不共享），**不要同时接业务**，否则同一个问题在两个后端上
  #    召回不同、索引各自演化。生产 = .110；.111 是冷备/演练机（收快照与归档，不接业务）。
  open-search:
    url: ${OPENSEARCH_URL:http://10.254.212.110:9200}
    index: ${OPENSEARCH_INDEX:pm-ai-chunks}
    username: ${OPENSEARCH_USER:admin}
    # 口令**只从环境变量/.env 读**：仓库里留空，日志/异常/自检里都不出现（只报"配没配"）。
    password: ${OPENSEARCH_PASSWORD:}
    # 单次 REST 请求超时（秒）。这是检索基础设施的超时，与 GPU 模型的超时分开。
    timeout-seconds: ${OPENSEARCH_TIMEOUT:20}
    # _bulk 每批文档数（切片向量 4096 维，单批约 10MB 级）。
    bulk-size: ${OPENSEARCH_BULK_SIZE:500}
    # hybrid（BM25 + kNN 两路融合）：默认关闭。理由见 AiSettings.OpenSearch#hybrid 的注释
    # （量纲不同需归一、本地已有关键词召回、开与不开没有评测基线）。
    hybrid: ${OPENSEARCH_HYBRID:false}
  # 模型调用的超时 / 并发 / 重试（P0-1、P0-5、P0-2）。取值依据见 AiSettings.Limits 的注释。
  limits:
    # 硬约束：所有模型超时必须 < caller-timeout-seconds（调用方主系统→AI 的预算 180s）。
    chat-timeout-seconds: ${LLM_CHAT_TIMEOUT:150}
    embed-timeout-seconds: ${VEC_EMBED_TIMEOUT:30}
    rerank-timeout-seconds: ${VEC_RERANK_TIMEOUT:20}
    caller-timeout-seconds: ${AI_CALLER_TIMEOUT:180}
    # 在飞上限（每模型信号量）：chat 4（平台 4 副本）/ embed 8（手册：批 32 + 并发 8 = 147.9 条/s）
    # / rerank 2（单实例、峰值 24.8 对/s、问答链路单点）；OCR 用上面的 OCR_CONCURRENCY=12。
    chat-concurrency: ${LLM_CHAT_CONCURRENCY:4}
    embed-concurrency: ${VEC_EMBED_CONCURRENCY:8}
    rerank-concurrency: ${VEC_RERANK_CONCURRENCY:2}
    # 等 permit 的时长：交互式（chat/rerank）短——宁可快速 503"模型繁忙"，也不排队到用户超时；
    # 批量（OCR/重建索引的向量化）长——没人等，可以排。
    interactive-acquire-ms: ${MODEL_ACQUIRE_TIMEOUT_MS:1500}
    batch-acquire-ms: ${MODEL_BATCH_ACQUIRE_TIMEOUT_MS:60000}
    # 只对**幂等**调用重试（OCR / embedding / 检索）；chat 永不重试。
    # 退避 1s → 4s + 抖动 0~250ms；仅重试连接错误/超时/5xx/429（4xx 与业务错误不重试）。
    retry-max: ${MODEL_RETRY_MAX:2}
    retry-backoff-ms: ${MODEL_RETRY_BACKOFF_MS:1000}
    retry-backoff-multiplier: ${MODEL_RETRY_BACKOFF_MULTIPLIER:4}
    retry-jitter-ms: ${MODEL_RETRY_JITTER_MS:250}
  # P2 受控查询（docs/AI前端与集成方案.md §11）：回调主系统 /api/ai/query/{entity} 的超时（秒）。
  # ⚠️ 回调地址与 scope_token **不在配置文件里**：它们由主系统在每次 /chat 请求的 biz_query 里现给，
  #    AI 侧不持有长期凭据（§11.1"反向回调"）。不传 biz_query 时不注册 query_business_data 工具。
  biz-query:
    timeout-seconds: ${BIZ_QUERY_TIMEOUT:20}
  # ── L1 业务并发闸门（设计 §5；与上面 ai.limits 的 L2 是"两层、单向"：先 L1 后 L2，L1 permit 全程持有）──
  # 三条防死锁硬规则：H1 顺序统一 / H2 排队不嵌套 / H3 优先级只在 L1（L2 恒为公平信号量）。
  # 顺序写反时 ModelRegistry 会立刻抛错而不是静默死锁（ai.model.h1.violations，正常恒 0）。
  gate:
    # false = 直接放行（只用于灰度对照/排障）：不建队列、不排队、不计数。
    enabled: ${AI_GATE_ENABLED:true}
    # 交互式（/chat、自检、检索调试）：并发 = 平台 4 个对话副本；**队列 0** ⇒ 等不到就 503 快速失败。
    interactive:
      max: ${AI_GATE_INTERACTIVE_MAX:4}
      queue: ${AI_GATE_INTERACTIVE_QUEUE:0}
      wait-ms: ${AI_GATE_INTERACTIVE_WAIT_MS:1500}
    # 批量解析：默认值与既有 uploadTaskExecutor（max 4 + 队列 100）逐字对齐 ⇒ 接入 L1 不改变既有行为。
    batch-parse:
      max: ${AI_GATE_BATCH_PARSE_MAX:4}
      queue: ${AI_GATE_BATCH_PARSE_QUEUE:100}
      wait-ms: ${AI_GATE_BATCH_PARSE_WAIT_MS:0}
      per-project-max: ${AI_GATE_BATCH_PARSE_PER_PROJECT_MAX:4}
    # 重建索引串行（现状 ReindexService 单 job，这里把该语义显式化）。
    batch-reindex:
      max: ${AI_GATE_BATCH_REINDEX_MAX:1}
      queue: ${AI_GATE_BATCH_REINDEX_QUEUE:2}
      wait-ms: ${AI_GATE_BATCH_REINDEX_WAIT_MS:1500}
      per-project-max: ${AI_GATE_BATCH_REINDEX_PER_PROJECT_MAX:1}
    # 批量向量化：4（不是 L2 的 8）——向量化是批内并行，L1 再放 8 个进来只会在 L2 排队。
    batch-embed:
      max: ${AI_GATE_BATCH_EMBED_MAX:4}
      queue: ${AI_GATE_BATCH_EMBED_QUEUE:100}
      wait-ms: ${AI_GATE_BATCH_EMBED_WAIT_MS:60000}
      per-project-max: ${AI_GATE_BATCH_EMBED_PER_PROJECT_MAX:4}
    # 评测跑批：最低优先级、无人在等。
    batch-eval:
      max: ${AI_GATE_BATCH_EVAL_MAX:1}
      queue: ${AI_GATE_BATCH_EVAL_QUEUE:100}
      wait-ms: ${AI_GATE_BATCH_EVAL_WAIT_MS:60000}
      per-project-max: ${AI_GATE_BATCH_EVAL_PER_PROJECT_MAX:1}
    # 每项目在飞上限的兜底值（按项目公平调度，设计 §5.3）。
    per-project-inflight-max: ${AI_GATE_PER_PROJECT_MAX:4}
    # 软闸门：交互式有等待者时暂停派发新的 BATCH.PARSE（只影响新任务，**绝不踢掉在跑的批量**）。
    pause-batch-when-interactive: ${AI_GATE_PAUSE_BATCH_WHEN_INTERACTIVE:true}
    # 老化：每等满 step 秒加 bonus 分、上限 max（防饥饿；effective_priority = 任务优先级 + 通道权重 + 老化）。
    # 这几项是设计 §5.6 允许的"运行时白名单"（重启回默认）。
    priority:
      interactive-weight: ${AI_GATE_WEIGHT_INTERACTIVE:100}
      batch-parse-weight: ${AI_GATE_WEIGHT_BATCH_PARSE:20}
      batch-reindex-weight: ${AI_GATE_WEIGHT_BATCH_REINDEX:10}
      batch-embed-weight: ${AI_GATE_WEIGHT_BATCH_EMBED:5}
      batch-eval-weight: ${AI_GATE_WEIGHT_BATCH_EVAL:0}
      aging-step-seconds: ${AI_GATE_AGING_STEP_SECONDS:30}
      aging-bonus-per-step: ${AI_GATE_AGING_BONUS_PER_STEP:2}
      aging-bonus-max: ${AI_GATE_AGING_BONUS_MAX:40}
  # ── 阶段上报（设计 §4；AI 服务不直连库，一律回调主系统的 /api/ai/pipeline/**）──
  # 鉴权头 X-AI-Service-Token = AI_SERVICE_TOKEN：**只从环境变量/.env 读**，绝不进仓库/日志/异常/指标/自检。
  # 上报失败不影响主流程（best-effort：只 WARN + 计数 ai.pipeline.report_failed）；**只有终态会重试**。
  pipeline:
    # 默认 false：没配地址/令牌时不做任何外呼，行为与接入前一致。
    enabled: ${AI_PIPELINE_ENABLED:false}
    # 主系统基地址（AI 是回调方；与 LLM_BASE_URL=平台网关不是一回事）。
    base-url: ${AI_PIPELINE_BASE_URL:}
    service-token: ${AI_SERVICE_TOKEN:}
    # 单次上报超时（秒）：取小值，上报是 best-effort，不能拖慢主流程。
    timeout-seconds: ${AI_PIPELINE_TIMEOUT:3}
    # 非终态上报**不重试**（失败只 WARN + 计数）；终态重试次数默认 2（共 3 次尝试）。
    max-retries: ${AI_PIPELINE_MAX_RETRIES:0}
    retry-backoff-ms: ${AI_PIPELINE_RETRY_BACKOFF_MS:200}
    finish-retries: ${AI_PIPELINE_FINISH_RETRIES:2}
    # 领取租约与心跳（契约字段 lease_seconds；409 ⇒ 立即停止该任务并放回）。
    heartbeat-seconds: ${AI_PIPELINE_HEARTBEAT_SECONDS:30}
    lease-seconds: ${AI_PIPELINE_LEASE_SECONDS:90}
    # 把 run_id 写进日志 MDC（排障时按一次任务过滤日志）。
    mdc: ${AI_PIPELINE_MDC:true}
    # 切片键形态（设计 §3.3.3 L1）：legacy = 三段（与接入前逐字节一致，升级不使既有索引/缓存失效）；
    # rev = d=<docId>:p=<pageNo>:h=<sha1>:c=<cleanRev>:k=<chunkRev>（规则变更即换键；切换后跑一次
    # POST /admin/reindex 统一）。解析器两种都认（兼容读）。
    chunk-key-format: ${AI_PIPELINE_CHUNK_KEY_FORMAT:legacy}
    # 流水线版本段（设计 §3.3.3）：任一变化 ⇒ 向量缓存整体失效重算。
    # clean-rev=0 = **清洗关闭**（默认口径：CLEAN 阶段如实上报 SKIPPED，切片输入 = 解析原文）；
    # 启用清洗（ai.clean.enabled=true）时必须把它设为 ≥1，并跑一次 POST /admin/reindex?force=true。
    parse-rev: ${AI_PIPELINE_PARSE_REV:1}
    clean-rev: ${AI_PIPELINE_CLEAN_REV:0}
    chunk-rev: ${AI_PIPELINE_CHUNK_REV:0}
  # ── 清洗阶段（设计 §3.3，G1/T7）──
  # 纯本地、确定性：同输入 + 同 clean_rev ⇒ 同输出（可缓存、可复算、可做前后对照）。
  # 规则只作用于**文本层与平台 OCR markdown 两路**解析结果（未知来源原样传下去）。
  # 产物：摘要进主系统的 clean_diff（≤4000 字符），全文留 work/clean/<docId>.json。
  clean:
    # 默认 false：CLEAN 阶段如实上报 SKIPPED + 原因，**行为与接入前逐字一致**（clean_rev=0）。
    # 打开时请同时把 ai.pipeline.clean-rev 设为 ≥1，并跑一次 POST /admin/reindex?force=true
    # （切片键含版本段、向量缓存头部含版本段，旧数据不会被误当命中）。
    enabled: ${AI_CLEAN_ENABLED:false}
    # 启用的规则清单（逗号分隔）。c1~c8 对应设计 §3.3.2：
    #   c1 页眉/页脚（跨页重复行）  c2 纯页码行  c3 空白与不可见字符归一  c4 断行合并/连字符修复
    #   c5 表格与正文分离（**只标记**）  c6 段级去重（默认只标记）  c7 编码归一   c8 水印（默认关）
    # 留空 = 用每条规则自己的默认开关（c1~c7 开、c8 关）。⚠️ 关掉 c5 等于同时关掉"表格不被 c3/c4/c8 动"的保护。
    rules: ${AI_CLEAN_RULES:c1,c2,c3,c4,c5,c6,c7}
    # c1 的跨页阈值：同一归一化行在 ≥该比例的页出现、且位于页首/页末 2 行内 ⇒ 判为页眉/页脚。
    header-footer-ratio: ${AI_CLEAN_HEADER_FOOTER_RATIO:0.5}
    # c1 的最小行长（字符）：短行不参与页眉/页脚判定。
    header-footer-min-chars: ${AI_CLEAN_HEADER_FOOTER_MIN_CHARS:4}
    # c6 的处置方式：false = **只标记不删**（duplicate_of 进产物供复核）；true 才真删重复段。
    dedup-drop: ${AI_CLEAN_DEDUP_DROP:false}
    # c8 的正则白名单（逗号分隔）。为空 = 该规则不生效（默认关）；命中的整行会被删除并留痕。
    watermark-patterns: ${AI_CLEAN_WATERMARK_PATTERNS:}
  # ── 切分（设计 §3.4，G11/G12）──
  # 结构感知 + 表格整块 + 重叠窗口 + 超长段落二次切 + 长度硬上限 + 父子块（同页邻块）。
  # 任何一项变化都要把 ai.pipeline.chunk-rev +1（否则"参数改了但切片键没变"）。
  chunk:
    # 默认 **false**（保守默认）：切片与"接入前的切法"逐字一致（段落累积到 chunk-chars 就断、
    # 无重叠、无结构感知、无长度上限）——这样本批代码上线**不改变**任何既有文档的切片/索引口径。
    # 开启条件（缺一不可）：① eval/smoke-30.json 的 citation_pages 已人工标注；
    # ② 已有 recall@5 基线（ai-backend 的 RetrievalEvalTool 能算出数）；③ 改 true 后跑一次
    # POST /admin/reindex?force=true（否则老文档仍是旧切法，新旧混在一套索引里，指标不可比）。
    improved: ${AI_CHUNK_IMPROVED:false}
    # 单个切片的**目标**字数（打包目标，不是硬上限）。默认 500，与接入前一致。
    chunk-chars: ${AI_CHUNK_CHARS:500}
    # 单个切片的**硬上限**（字符）。验收口径：不存在 > 该值的切片；超长段落按句末标点二次切。
    max-char-len: ${AI_CHUNK_MAX_CHAR_LEN:2000}
    # 相邻切片的重叠比例（0~1，上限 0.15）。默认 0.12 ≈ 500×12% = 60 字；按句回退、只在本页内。
    overlap-ratio: ${AI_CHUNK_OVERLAP_RATIO:0.12}
    # 是否按标题/条款边界优先切（关闭即退化为"按段落打包"）。
    structure-aware: ${AI_CHUNK_STRUCTURE_AWARE:true}
    # 表格整块不截断（超硬上限时按行切、每片重复表头行 + 分隔行）。
    tables-whole: ${AI_CHUNK_TABLES_WHOLE:true}
    # 父块摘要字数上限（父子块 small-to-big 的"上卷"；0 = 关闭）。
    parent-summary-chars: ${AI_CHUNK_PARENT_SUMMARY_CHARS:200}

# 指标（P0-6，唯一的本轮新增依赖 spring-boot-starter-actuator + micrometer）。
# 读法：
#   · 每模型 QPS        /actuator/metrics/ai.model.requests        （COUNT，按 outcome 分子）
#   · 延迟分位 P50/95/99 /actuator/metrics/ai.model.latency        （publishPercentiles 在代码里开，不依赖配置）
#   · 在途 / 排队 / 上限  /actuator/metrics/ai.model.inflight、ai.model.queue.depth、ai.model.concurrency.limit
#   · 解析队列深度       /actuator/metrics/ai.upload.queue.depth、ai.upload.inflight
#   · L1 业务闸门（10 项）/actuator/metrics/ai.gate.depth、inflight、limit、admitted、rejected、
#                        waiting_ms、fairness.per_project、aging.bonus（+ per_project.inflight.max、aging.bonus.awarded）
#   · 阶段上报           /actuator/metrics/ai.pipeline.report_failed、report_sent、report_latency
#   · 聚合视图（一眼看全）curl 'http://127.0.0.1:8100/health?with_metrics=true'
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.pmgt.ai: ${AI_LOG_LEVEL:INFO}
  pattern:
    # 带请求/任务上下文，出问题能查（Python 版这一项是 P0 补齐的）
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
