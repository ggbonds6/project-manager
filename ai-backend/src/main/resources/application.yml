server:
  port: ${AI_PORT:8100}
  # 与 Python 版一致：上传可达 500MB（附件里有大 PDF 与扫描件）
  tomcat:
    max-swallow-size: -1

spring:
  application:
    name: pm-ai-service
  # 本机开发把凭据写在 ai-backend/.env（不入库，见 .gitignore）——与 Python 版同一套变量名，
  # 运维不用改脚本。[.properties] 是告诉 Spring 按 properties 解析这个文件（KEY=VALUE 两种格式通用）；
  # optional: 表示文件不存在也不报错（生产直接用真实环境变量/容器 env）。
  # 优先级：OS 环境变量 > .env（所以容器里注入的变量会覆盖本机文件）。
  config:
    import: optional:file:./.env[.properties]
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 600MB
  jackson:
    default-property-inclusion: non_null

# AI 服务配置：默认值都在 AiSettings 里，这里只做"环境变量 → 配置"的映射，
# 键名与 Python 版保持一致，便于平滑切换（同样的 .env 两边都能读）。
ai:
  work-dir: ${WORK_DIR:./work}
  gateway:
    base-url: ${LLM_BASE_URL:http://10.254.208.35:8090/v1}
    api-key: ${LLM_API_KEY:}
    timeout-seconds: ${LLM_TIMEOUT:300}
  llm:
    model: ${LLM_MODEL:Qwen3.8-27B-W8A8}
    max-input-chars: ${LLM_MAX_INPUT_CHARS:20000}
    max-tokens: ${LLM_MAX_TOKENS:16384}
    enable-thinking: ${LLM_ENABLE_THINKING:false}
  ocr:
    # 平台 OCR 地址默认复用网关（同一个网关、同一把 sk）
    model: ${OCR_MODEL:PaddleOCR-VL-1.6-0.9B}
    timeout-seconds: ${OCR_TIMEOUT:600}
    concurrency: ${OCR_CONCURRENCY:12}
    batch-pages: ${OCR_BATCH_PAGES:8}
    seal: ${OCR_SEAL:false}
    seal-min-pixels: ${OCR_SEAL_MIN_PIXELS:400000}
    platform-dpi: ${OCR_PLATFORM_DPI:150}
    platform-format: ${OCR_PLATFORM_FORMAT:jpeg}
    platform-quality: ${OCR_PLATFORM_QUALITY:85}
  vec:
    embed-model: ${VEC_EMBED_MODEL:Qwen3-VL-Embedding-8B}
    rerank-model: ${VEC_RERANK_MODEL:Qwen3-VL-Reranker-8B}
    # 0 = 不传维度（平台默认 4096；本部署不支持 MRL 降维）
    dimensions: ${VEC_EMBED_DIMENSIONS:0}
  retrieval:
    recall: ${RETRIEVAL_RECALL:50}
    top-k: ${RETRIEVAL_TOP_K:5}
    backend: ${VEC_BACKEND:local}
  open-search:
    url: ${OPENSEARCH_URL:}
    index: ${OPENSEARCH_INDEX:pm-ai-chunks}
    username: ${OPENSEARCH_USER:}
    password: ${OPENSEARCH_PASSWORD:}

logging:
  level:
    com.pmgt.ai: ${AI_LOG_LEVEL:INFO}
  pattern:
    # 带请求/任务上下文，出问题能查（Python 版这一项是 P0 补齐的）
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
