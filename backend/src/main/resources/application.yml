server:
  port: 8080

spring:
  application:
    name: project-manager-backend
  datasource:
    # 崖山 YashanDB（Oracle 模式）主备集群，驱动级 primary + TAF 高可用
    # 连接信息一律环境变量注入；密码含 @ 等特殊字符，整体引号包裹
    driver-class-name: com.yashandb.jdbc.Driver
    # YASHAN_DB = 崖山 Oracle 模式下的 schema 名（生产为 PM，注意大写；默认值与生产一致，防漏配连错库）
    url: "jdbc:yasdb:primary://${YASHAN_MASTER_IP:10.254.212.106}:1688,${YASHAN_STANDBY_IP:10.254.212.107}:1688/${YASHAN_DB:PM}?poolTimeout=60&failover=on&failoverType=session&failoverMethod=basic&failoverRetries=5&failoverDelay=2"
    username: ${YASHAN_USER:pm}
    password: "${YASHAN_PASSWORD:}"
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 15000   # 主备切换时留足建连时间
  servlet:
    multipart:
      # 单文件上限。政务附件常有大幅扫描件/图纸，100MB 偏紧（超限会抛
      # FileSizeLimitExceededException 直接 500），放宽到 500MB；
      # 同步需匹配 nginx 的 client_max_body_size，并确认容器临时目录有足够空间。
      max-file-size: 500MB
      max-request-size: 600MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  # 后台上传的本地暂存目录：文件先落这里并立即返回，后台线程再推送到最终存储，成功即删除。
  # 建议指向容器本地盘（不要放附件卷，以免与正式附件混在一起）。
  upload-tmp-dir: ${UPLOAD_TMP_DIR:./upload-tmp}
  # 附件存储：local（本地磁盘，默认） | obs（华为 OBS，S3 兼容 + path-style + 忽略证书校验）
  storage:
    type: ${APP_STORAGE_TYPE:local}
    obs:
      endpoint: ${APP_STORAGE_OBS_ENDPOINT:}
      bucket: ${APP_STORAGE_OBS_BUCKET:}
      ak: ${APP_STORAGE_OBS_AK:}
      sk: ${APP_STORAGE_OBS_SK:}
      # 对象 key 前缀（桶内目录），本项目附件统一存于桶内 uploads/ 下；桶根直存可置空
      prefix: ${APP_STORAGE_OBS_PREFIX:uploads}
  jwt:
    # 仅本地开发默认值；生产环境务必通过环境变量覆盖
    secret: ${JWT_SECRET:change-me-please-this-is-a-dev-secret-0123456789abcdef}
    expire-hours: 168

logging:
  level:
    com.pmgt: info
