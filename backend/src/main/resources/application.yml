server:
  port: 8080

spring:
  application:
    name: project-manager-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/project_manager?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: pm
    password: Pm@123456
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  jwt:
    # 仅本地开发默认值；生产环境务必通过环境变量覆盖
    secret: ${JWT_SECRET:change-me-please-this-is-a-dev-secret-0123456789abcdef}
    expire-hours: 168

logging:
  level:
    com.pmgt: info
