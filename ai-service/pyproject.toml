[project]
name = "pm-ai-service"
version = "0.1.0"
description = "项目管理系统的 AI 能力服务（附件解析 / OCR / 抽取 / 检索），独立部署，与主系统通过 HTTP 交互"
requires-python = ">=3.10"

dependencies = [
  # Web 服务
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  # 文档处理
  "pymupdf>=1.24",          # PDF 文本提取 + 页面渲染为图片（不依赖 poppler）
  "pillow>=10.0",
  # OCR（RapidOCR = PaddleOCR 模型的 ONNX 版：同样模型、依赖更少、装机更省事）
  "rapidocr-onnxruntime>=1.3",
  # 大模型调用（千问走 OpenAI 兼容协议）
  "openai>=1.30",
  # 配置与统计
  "python-dotenv>=1.0",
  "pandas>=2.0",
  "openpyxl>=3.1",          # to_excel 需要
]

[project.optional-dependencies]
# 备选 OCR：若 RapidOCR 效果不达标，换成完整 PaddleOCR（同为同一批模型，含更全的后处理）
paddle = [
  "paddleocr>=2.7",
  "paddlepaddle>=2.6",
]

[project.scripts]
pm-ai = "pm_ai.api:run"

# ── 打包配置（**必需**）────────────────────────────────────────
# 本项目是 src 布局（源码在 src/pm_ai/），必须显式声明包发现路径，
# 否则 `pip install -e .` 会装上但导入不到 pm_ai（脚本里手写 sys.path 才能跑）。
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
