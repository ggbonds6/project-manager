<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM AI Service · 附件智能分析</title>
<script src="/static/marked.min.js"></script>
<style>
  :root{
    --bg:#f4f6fa; --card:#fff; --line:#e3e8f0; --text:#1f2733; --muted:#6b7785;
    --brand:#2563eb; --brand-dark:#1d4ed8;
    --ok:#0f9d58; --warn:#e8a33d; --danger:#d93025;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  }
  header{
    background:var(--card); border-bottom:1px solid var(--line);
    padding:16px 24px; display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:10;
  }
  header h1{font-size:16px; margin:0; font-weight:600; letter-spacing:.2px}
  header h1 span{color:var(--muted); font-weight:400; font-size:13px; margin-left:8px}
  #status{font-size:13px; color:var(--muted)}
  #status.ok{color:var(--ok)} #status.bad{color:var(--danger)}
  main{max-width:960px; margin:0 auto; padding:24px 20px 80px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:18px}

  /* ── 上传区 ── */
  .dropzone{
    border:2px dashed #c8d3e2; border-radius:10px; padding:32px 16px; text-align:center;
    cursor:pointer; transition:.15s; background:#fafbfd;
  }
  .dropzone:hover,.dropzone.over{border-color:var(--brand); background:#f0f6ff}
  .dz-icon{font-size:30px; line-height:1}
  .dz-title{margin-top:10px; font-size:15px; font-weight:500}
  .dz-hint{color:var(--muted); font-size:12.5px; margin-top:6px}
  .fileinfo{
    margin-top:14px; padding:10px 14px; background:#f0f6ff; border-radius:8px;
    font-size:13px; display:flex; justify-content:space-between; gap:12px;
  }
  .fileinfo b{font-weight:600}
  .field{display:block; margin-top:16px}
  .field>span{display:block; font-size:13px; color:var(--muted); margin-bottom:6px}
  textarea{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    font:inherit; resize:vertical; color:var(--text);
  }
  textarea:focus{outline:none; border-color:var(--brand)}
  .actions{margin-top:16px; display:flex; gap:10px}
  button{
    padding:9px 18px; border-radius:8px; border:1px solid transparent; cursor:pointer;
    font:inherit; font-weight:500; background:var(--brand); color:#fff; transition:.15s;
  }
  button:hover:not(:disabled){background:var(--brand-dark)}
  button:disabled{opacity:.45; cursor:not-allowed}
  button.ghost{background:#fff; color:var(--text); border-color:var(--line)}
  button.ghost:hover:not(:disabled){background:#f2f5f9; border-color:#c8d3e2}

  /* ── 进度 ── */
  .progress{display:flex; align-items:center; gap:12px; font-size:14px}
  .spinner{
    width:18px; height:18px; border:2px solid #d7e0ec; border-top-color:var(--brand);
    border-radius:50%; animation:spin .8s linear infinite; flex:none;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  .progress small{display:block; color:var(--muted); font-size:12.5px; margin-top:2px}

  /* ── 元信息 ── */
  .meta{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px}
  .chip{
    font-size:12.5px; padding:4px 10px; border-radius:20px;
    background:#eef2f8; color:#41505f; white-space:nowrap;
  }
  .chip b{font-weight:600}
  .chip.warn{background:#fdf4e3; color:#8a5b00}
  .chip.bad{background:#fdeceb; color:#a3231b}
  .notice{
    padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:14px;
    background:#fdf4e3; border-left:3px solid var(--warn); color:#7a5200;
  }
  .notice.info{background:#eef4ff; border-left-color:var(--brand); color:#23457f}
  .toolbar{display:flex; gap:8px; margin-bottom:12px}

  /* ── markdown 输出 ── */
  .markdown{border-top:1px solid var(--line); padding-top:16px; overflow-x:auto}
  .markdown h3{
    font-size:15px; margin:24px 0 10px; padding-left:10px;
    border-left:3px solid var(--brand); line-height:1.4;
  }
  .markdown h3:first-child{margin-top:0}
  .markdown h1,.markdown h2{font-size:16px; margin:20px 0 10px}
  .markdown table{border-collapse:collapse; width:100%; margin:12px 0; font-size:13.5px}
  .markdown th,.markdown td{border:1px solid var(--line); padding:8px 10px; text-align:left; vertical-align:top}
  .markdown th{background:#f7f9fc; font-weight:600; white-space:nowrap}
  .markdown tbody tr:nth-child(even){background:#fcfdff}
  .markdown blockquote{
    margin:10px 0; padding:8px 14px; border-left:3px solid #c8d3e2;
    background:#fafbfd; color:#46525f;
  }
  .markdown code{background:#f0f3f8; padding:1px 5px; border-radius:4px; font-size:12.5px}
  .markdown ul,.markdown ol{padding-left:22px}
  .markdown hr{border:none; border-top:1px solid var(--line); margin:18px 0}

  /* 来源标记与置信度着色 —— 让"可疑项"一眼可见 */
  .src{
    display:inline-block; font-size:11.5px; padding:1px 6px; border-radius:4px;
    background:#e7efff; color:#2554a8; font-weight:600; white-space:nowrap;
  }
  td.conf{font-weight:600; text-align:center; white-space:nowrap}
  td.conf-high{color:var(--ok); background:#f0faf4}
  td.conf-mid{color:#a86a00; background:#fdf7e8}
  td.conf-low{color:var(--danger); background:#fdeeed}
  .legend{font-size:12.5px; color:var(--muted); margin-top:10px; line-height:1.9}
  .legend i{font-style:normal; padding:1px 6px; border-radius:4px; margin-right:4px}
</style>
</head>
<body>

<header>
  <h1>PM AI Service<span>附件智能分析</span></h1>
  <div id="status">正在检查服务状态…</div>
</header>

<main>
  <!-- 上传 -->
  <section class="card">
    <div class="dropzone" id="dropzone">
      <input type="file" id="fileInput" hidden
             accept=".pdf,.png,.jpg,.jpeg,.bmp,.tif,.tiff,.webp">
      <div class="dz-icon">📄</div>
      <div class="dz-title">点击选择文件，或拖拽到此处</div>
      <div class="dz-hint">支持 PDF 与图片（png / jpg / tif 等）；文本型 PDF 直接取文本层，扫描件自动 OCR</div>
    </div>

    <div class="fileinfo" id="fileInfo" hidden></div>

    <label class="field">
      <span>特别关注点（可选）—— 留空则按文档类型自动判断应抽取的关键信息</span>
      <textarea id="instruction" rows="2"
        placeholder="例如：抽取合同约定的支付节点、各期比例与金额；列出所有涉及人员的姓名与身份证号"></textarea>
    </label>

    <div class="actions">
      <button id="submitBtn" disabled>开始分析</button>
      <button id="clearBtn" class="ghost">清空</button>
    </div>
  </section>

  <!-- 进度 -->
  <section class="card" id="progressCard" hidden>
    <div class="progress">
      <div class="spinner"></div>
      <div>
        <div id="progressText">正在处理…</div>
        <small id="progressHint"></small>
      </div>
    </div>
  </section>

  <!-- 结果 -->
  <section class="card" id="resultCard" hidden>
    <div id="noticeBox"></div>
    <div class="meta" id="meta"></div>
    <div class="toolbar">
      <button id="copyBtn" class="ghost">复制 Markdown</button>
      <button id="downloadBtn" class="ghost">下载 .md</button>
    </div>
    <article class="markdown" id="output"></article>
    <div class="legend" id="legend">
      置信度分档：
      <i style="background:#f0faf4;color:#0f9d58">≥0.90 明确</i>
      <i style="background:#fdf7e8;color:#a86a00">0.60–0.89 需留意</i>
      <i style="background:#fdeeed;color:#d93025">&lt;0.60 存疑</i>
      ｜ <span class="src">P2</span> 表示该信息来自第 2 页
      <br>
      ⚠️ 置信度为<b>模型自评</b>，用于提示复核优先级，<b>不能替代人工核对</b>；
      金额、日期、编号请务必对照原文。
    </div>
  </section>
</main>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const dropzone = $('dropzone'), fileInput = $('fileInput'), fileInfo = $('fileInfo');
  const submitBtn = $('submitBtn'), clearBtn = $('clearBtn'), instruction = $('instruction');
  const progressCard = $('progressCard'), progressText = $('progressText'), progressHint = $('progressHint');
  const resultCard = $('resultCard'), output = $('output'), meta = $('meta');
  const noticeBox = $('noticeBox'), status = $('status');

  let currentFile = null, timer = null, lastMarkdown = '', lastFileName = '';

  marked.setOptions({ gfm: true, breaks: true });

  // ── 服务状态 ──────────────────────────────────────────────
  fetch('/health').then(r => r.json()).then(d => {
    const c = d.config || {};
    status.textContent = `服务正常 · 模型 ${c.llm_model || '-'}`;
    status.className = 'ok';
  }).catch(() => {
    status.textContent = '服务不可达';
    status.className = 'bad';
  });

  // ── 文件选择 ──────────────────────────────────────────────
  function pick(file) {
    if (!file) return;
    currentFile = file;
    const mb = (file.size / 1024 / 1024).toFixed(2);
    fileInfo.hidden = false;
    fileInfo.innerHTML = `<span>已选择：<b>${escapeHtml(file.name)}</b></span><span>${mb} MB</span>`;
    submitBtn.disabled = false;
    resultCard.hidden = true;
    noticeBox.innerHTML = '';
  }

  dropzone.addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', e => pick(e.target.files[0]));
  ['dragenter', 'dragover'].forEach(ev => dropzone.addEventListener(ev, e => {
    e.preventDefault(); dropzone.classList.add('over');
  }));
  ['dragleave', 'drop'].forEach(ev => dropzone.addEventListener(ev, e => {
    e.preventDefault(); dropzone.classList.remove('over');
  }));
  dropzone.addEventListener('drop', e => pick(e.dataTransfer.files[0]));

  clearBtn.addEventListener('click', () => {
    currentFile = null; fileInput.value = ''; instruction.value = '';
    fileInfo.hidden = true; resultCard.hidden = true; progressCard.hidden = true;
    submitBtn.disabled = true;
  });

  // ── 提交 ─────────────────────────────────────────────────
  submitBtn.addEventListener('click', async () => {
    if (!currentFile) return;
    submitBtn.disabled = true;
    resultCard.hidden = true;
    noticeBox.innerHTML = '';
    progressCard.hidden = false;

    let si = 0;
    setStage(0);
    timer = setInterval(() => { si = Math.min(si + 1, STAGES.length - 1); setStage(si); }, 12000);

    const form = new FormData();
    form.append('file', currentFile);
    form.append('instruction', instruction.value || '');

    try {
      const resp = await fetch('/analyze', { method: 'POST', body: form });
      const json = await resp.json();
      if (!resp.ok || json.code !== 0) {
        throw new Error(json.detail || `请求失败（HTTP ${resp.status}）`);
      }
      render(json.data);
    } catch (err) {
      noticeBox.innerHTML = `<div class="notice" style="background:#fdeceb;border-left-color:#d93025;color:#a3231b">
        <b>分析失败：</b>${escapeHtml(String(err.message || err))}</div>`;
      resultCard.hidden = false;
    } finally {
      clearInterval(timer);
      progressCard.hidden = true;
      submitBtn.disabled = false;
    }
  });

  // 没有流式返回，用文案轮播说明"现在在干什么"，避免用户以为卡死
  const STAGES = [
    ['正在识别文档内容…', '文本型 PDF 很快；扫描件需逐页 OCR，可能持续数十秒'],
    ['正在调用大模型分析…', '模型需通读原文并逐条标注来源与置信度'],
    ['仍在分析中，请稍候…', '篇幅越长耗时越久，请勿关闭页面'],
  ];

  function setStage(i) {
    const s = STAGES[Math.min(i, STAGES.length - 1)];
    progressText.textContent = s[0];
    progressHint.textContent = s[1];
  }

  // ── 渲染结果 ──────────────────────────────────────────────
  function render(data) {
    const d = data.doc || {}, llm = data.llm || {};
    lastMarkdown = data.markdown || '';
    lastFileName = (data.file || 'result').replace(/\.[^.]+$/, '');

    // 提示条
    let notes = '';
    if (data.warning) {
      notes += `<div class="notice"><b>提示：</b>${escapeHtml(data.warning)}</div>`;
    }
    if (data.truncated) {
      notes += `<div class="notice"><b>注意：</b>${escapeHtml(data.truncate_note || '原文超长已截断')}</div>`;
    }
    const lowPages = (d.low_confidence_pages || []);
    if (lowPages.length) {
      notes += `<div class="notice"><b>识别质量偏低：</b>第 ${lowPages.join('、')} 页
        识别置信度低于 0.85，请优先人工复核这几页。</div>`;
    }
    const emptyPages = (d.empty_pages || []);
    if (emptyPages.length) {
      notes += `<div class="notice"><b>空白页：</b>第 ${emptyPages.join('、')} 页未识别到文本。</div>`;
    }
    notes += `<div class="notice info">以下内容由大模型基于原文抽取生成，每条均标注来源页码与置信度。
      <b>请对照原文核验后再使用</b>，尤其是金额、日期与编号。</div>`;
    noticeBox.innerHTML = notes;

    // 元信息
    const kindMap = { text_pdf: '文本型 PDF', scanned: '扫描件', image: '图片' };
    const chips = [];
    chips.push(`<span class="chip">文件：<b>${escapeHtml(data.file || '-')}</b></span>`);
    chips.push(`<span class="chip">类型：<b>${kindMap[d.kind] || d.kind || '-'}</b></span>`);
    if (d.pages) chips.push(`<span class="chip">页数：<b>${d.pages}</b></span>`);
    if (d.chars != null) chips.push(`<span class="chip">文本：<b>${d.chars}</b> 字</span>`);
    if (d.avg_confidence != null) {
      const v = d.avg_confidence;
      const cls = v >= 0.9 ? 'chip' : 'chip warn';
      chips.push(`<span class="${cls}">识别置信度：<b>${v}</b></span>`);
    }
    if (llm.model) chips.push(`<span class="chip">模型：<b>${escapeHtml(llm.model)}</b></span>`);
    if (llm.elapsed != null) chips.push(`<span class="chip">总耗时：<b>${llm.elapsed}s</b></span>`);
    if (llm.prompt_tokens) chips.push(`<span class="chip">tokens：${llm.prompt_tokens}+${llm.completion_tokens || 0}</span>`);
    meta.innerHTML = chips.join('');

    // markdown
    output.innerHTML = sanitize(marked.parse(lastMarkdown));
    decorate(output);
    resultCard.hidden = false;
    resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // 给置信度单元格着色、把 [P2] 变成小标签
  function decorate(root) {
    root.querySelectorAll('td').forEach(td => {
      const raw = td.textContent.trim();
      // [P1] / [P1,P2] → 标签
      if (/\[P\d+(,\s*P\d+)*\]/.test(td.innerHTML)) {
        td.innerHTML = td.innerHTML.replace(/\[(P\d+(?:,\s*P\d+)*)\]/g,
          '<span class="src">$1</span>');
      }
      // 纯数字且落在 0–1 → 置信度着色
      const m = raw.match(/^(0(?:\.\d+)?|1(?:\.0+)?)$/);
      if (m) {
        const v = parseFloat(raw);
        td.classList.add('conf', v >= 0.9 ? 'conf-high' : v >= 0.6 ? 'conf-mid' : 'conf-low');
      }
    });
  }

  // LLM 输出为不可信内容，做基本清理（内网自用，仍避免脚本注入）
  function sanitize(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('script,style,iframe,object,embed,link,meta,form,base')
      .forEach(n => n.remove());
    doc.querySelectorAll('*').forEach(el => {
      [...el.attributes].forEach(a => {
        if (/^on/i.test(a.name)) el.removeAttribute(a.name);
        if ((a.name === 'href' || a.name === 'src') && /^\s*javascript:/i.test(a.value)) {
          el.removeAttribute(a.name);
        }
      });
    });
    return doc.body.innerHTML;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // ── 复制 / 下载 ───────────────────────────────────────────
  $('copyBtn').addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(lastMarkdown);
      $('copyBtn').textContent = '已复制 ✓';
    } catch {
      $('copyBtn').textContent = '复制失败';
    }
    setTimeout(() => { $('copyBtn').textContent = '复制 Markdown'; }, 1600);
  });

  $('downloadBtn').addEventListener('click', () => {
    const blob = new Blob([lastMarkdown], { type: 'text/markdown;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = (lastFileName || 'result') + '.分析结果.md';
    a.click();
    URL.revokeObjectURL(a.href);
  });
})();
</script>
</body>
</html>
