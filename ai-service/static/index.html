<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PM AI Service · 文档库与问答</title>
<style>
  :root{
    --bg:#f4f6fa; --card:#fff; --line:#e3e8f0; --text:#1f2733; --muted:#6b7785;
    --brand:#2563eb; --brand-dark:#1d4ed8;
    --ok:#0f9d58; --warn:#e8a33d; --danger:#d93025; --info:#2554a8;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column;
  }
  header{
    background:var(--card); border-bottom:1px solid var(--line);
    padding:12px 20px; display:flex; align-items:center; justify-content:space-between; flex:none;
  }
  header h1{font-size:16px; margin:0; font-weight:600}
  header h1 span{color:var(--muted); font-weight:400; font-size:13px; margin-left:8px}
  #status{font-size:12.5px; color:var(--muted); text-align:right}
  #status .ok{color:var(--ok)} #status .bad{color:var(--danger)}
  #status small{display:block; color:var(--muted)}

  .layout{flex:1; display:flex; min-height:0}

  /* ── 左栏 ── */
  .sidebar{
    width:344px; flex:none; background:var(--card); border-right:1px solid var(--line);
    display:flex; flex-direction:column; min-height:0;
  }
  .side-block{border-bottom:1px solid var(--line); display:flex; flex-direction:column; min-height:0}
  .side-head{padding:11px 14px 9px; display:flex; align-items:center; justify-content:space-between}
  .side-head b{font-size:13.5px}
  .side-head .meta{font-size:12px; color:var(--muted)}
  .side-hint{padding:0 14px 10px; font-size:11.5px; color:var(--muted); line-height:1.6}
  .side-hint kbd{background:#f0f3f8; border-radius:3px; padding:0 3px; font-size:11px}

  button.primary{
    padding:6px 13px; border-radius:8px; border:none; cursor:pointer;
    font:inherit; font-size:13px; font-weight:500; background:var(--brand); color:#fff;
  }
  button.primary:hover:not(:disabled){background:var(--brand-dark)}
  button.primary:disabled{opacity:.45; cursor:not-allowed}
  button.ghost{
    padding:3px 9px; border-radius:7px; border:1px solid var(--line); background:#fff;
    color:#41505f; cursor:pointer; font-size:12px;
  }
  button.ghost:hover{border-color:var(--brand); color:var(--brand-dark)}

  /* 上传队列 */
  .queue{max-height:46vh; overflow-y:auto; padding:0 10px 8px}
  .qtask{border:1px solid var(--line); border-radius:9px; padding:9px 10px; margin-bottom:7px; background:#fff}
  .qtask.running{border-color:#c9dcff; background:#f8fbff}
  .qtask.done{border-color:#d8ebdf}
  .qtask.failed{border-color:#f3c0bc; background:#fffafa}
  .qtask .top{display:flex; align-items:center; gap:6px; justify-content:space-between}
  .qtask .fname{font-size:12.5px; font-weight:500; word-break:break-all; flex:1}
  .qtask .row2{font-size:11.5px; color:var(--muted); margin-top:4px; display:flex; justify-content:space-between; gap:8px}
  .bar{height:5px; border-radius:3px; background:#eef2f8; overflow:hidden; margin-top:7px}
  .bar > i{display:block; height:100%; background:var(--brand); transition:width .3s}
  .qtask.done .bar > i{background:var(--ok)}
  .qtask.failed .bar > i{background:var(--danger)}
  .badge{
    font-size:11px; padding:1px 7px; border-radius:10px; font-weight:600; white-space:nowrap;
    background:#eef2f8; color:#4a5866;
  }
  .badge.run{background:#e7efff; color:var(--info)}
  .badge.ok{background:#e6f5ec; color:#0b7a44}
  .badge.bad{background:#fdeceb; color:#a3231b}
  .badge.warn{background:#fdf4e3; color:#7a5200}
  .qmore{margin-top:7px; border-top:1px dashed var(--line); padding-top:6px; font-size:11.5px; color:#41505f}
  .qmore table{width:100%; border-collapse:collapse; font-size:11px; margin-top:4px}
  .qmore th,.qmore td{border-bottom:1px solid #eef2f8; padding:2px 4px; text-align:left}
  .qmore th{color:var(--muted); font-weight:500}
  .qmore .err{color:#a3231b}

  /* 文档库 */
  .doc-list{flex:1; overflow-y:auto; padding:0 10px 10px; min-height:0}
  .doc-item{
    border:1px solid var(--line); border-radius:8px; padding:8px 10px; margin-bottom:6px;
    cursor:pointer; transition:.12s; position:relative;
  }
  .doc-item:hover{border-color:#c8d3e2; background:#fafbfd}
  .doc-item.on{border-color:var(--brand); background:#f0f6ff}
  .doc-item .name{font-size:12.5px; font-weight:500; word-break:break-all; padding-right:34px}
  .doc-item .sub{font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.6}
  .doc-item .tools{position:absolute; right:5px; top:5px; display:flex; gap:2px}
  .doc-item .tools button{
    border:none; background:transparent; cursor:pointer; color:#b9c2ce; font-size:13px;
    line-height:1; padding:2px 3px;
  }
  .doc-item .tools button:hover{color:var(--brand)}
  .doc-item .tools button.del:hover{color:var(--danger)}

  /* ── 右：问答 ── */
  .chat{flex:1; display:flex; flex-direction:column; min-width:0; min-height:0}
  .messages{flex:1; overflow-y:auto; padding:18px 22px 8px}
  .msg{max-width:840px; margin:0 auto 16px; display:flex; gap:10px}
  .msg .avatar{width:28px; height:28px; border-radius:6px; flex:none; display:flex;
    align-items:center; justify-content:center; font-size:14px}
  .msg.user .avatar{background:#e7efff}
  .msg.bot .avatar{background:#eef7f0}
  .msg .body{flex:1; min-width:0}
  .msg .bubble{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:11px 14px}
  .msg.user .bubble{background:#f0f6ff; border-color:#d6e4ff; white-space:pre-wrap}
  .msg .who{font-size:12px; color:var(--muted); margin-bottom:5px}

  .trace{margin:0 0 8px; font-size:12.5px}
  .trace summary{cursor:pointer; color:var(--muted); list-style:none; padding:2px 0}
  .trace summary::-webkit-details-marker{display:none}
  .trace summary::before{content:"▸ "}
  .trace[open] summary::before{content:"▾ "}
  .trace .item{padding:4px 9px; margin:4px 0 0 10px; border-left:2px solid #d6e4ff; color:#41505f; font-size:12px}
  .trace .item.err{border-left-color:#f3c0bc; color:#a3231b}
  .trace code{background:#f0f3f8; padding:1px 4px; border-radius:3px}

  .markdown h1,.markdown h2,.markdown h3{font-size:15px; margin:14px 0 7px}
  .markdown h3{padding-left:9px; border-left:3px solid var(--brand); line-height:1.4}
  .markdown table{border-collapse:collapse; width:100%; margin:9px 0; font-size:13.5px}
  .markdown th,.markdown td{border:1px solid var(--line); padding:6px 9px; text-align:left; vertical-align:top}
  .markdown th{background:#f7f9fc; font-weight:600; white-space:nowrap}
  .markdown tbody tr:nth-child(even){background:#fcfdff}
  .markdown blockquote{margin:8px 0; padding:6px 12px; border-left:3px solid #c8d3e2; background:#fafbfd; color:#46525f}
  .markdown code{background:#f0f3f8; padding:1px 5px; border-radius:4px; font-size:12.5px}
  .markdown ul,.markdown ol{padding-left:22px}
  .markdown p:first-child{margin-top:0}
  .markdown p:last-child{margin-bottom:0}
  .src{display:inline-block; font-size:11.5px; padding:1px 6px; border-radius:4px;
    background:#e7efff; color:#2554a8; font-weight:600; white-space:nowrap}

  .notice{padding:9px 13px; border-radius:8px; font-size:13px; margin:0 auto 13px;
    background:#fdf4e3; border-left:3px solid var(--warn); color:#7a5200; max-width:840px}
  .notice.info{background:#eef4ff; border-left-color:var(--brand); color:#23457f}
  .notice.bad{background:#fdeceb; border-left-color:var(--danger); color:#a3231b}
  .spin{display:inline-block; width:13px; height:13px; border:2px solid #d7e0ec;
    border-top-color:var(--brand); border-radius:50%; animation:spin .8s linear infinite;
    vertical-align:-2px; margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}

  .composer{flex:none; border-top:1px solid var(--line); background:var(--card); padding:11px 22px 15px}
  .composer-inner{max-width:840px; margin:0 auto}
  .quick{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; align-items:center}
  .quick .lbl{font-size:12px; color:var(--muted)}
  .quick button{font-size:12px; padding:3px 10px; border-radius:14px; border:1px solid var(--line);
    background:#fff; color:#41505f; cursor:pointer}
  .quick button:hover{border-color:var(--brand); color:var(--brand-dark)}
  .input-row{display:flex; gap:9px; align-items:flex-end}
  textarea{flex:1; padding:10px 12px; border:1px solid var(--line); border-radius:9px;
    font:inherit; resize:none; min-height:44px; max-height:150px; color:var(--text)}
  textarea:focus{outline:none; border-color:var(--brand)}
  button.send{padding:11px 20px; border-radius:9px; border:none; cursor:pointer;
    font:inherit; font-weight:500; background:var(--brand); color:#fff; flex:none}
  button.send:hover:not(:disabled){background:var(--brand-dark)}
  button.send:disabled{opacity:.45; cursor:not-allowed}

  .empty{text-align:center; color:var(--muted); padding:60px 20px; font-size:13.5px}

  /* 拖拽 */
  body.dragging::after{
    content:"松开即可上传"; position:fixed; inset:0; background:rgba(37,99,235,.08);
    border:3px dashed var(--brand); display:flex; align-items:center; justify-content:center;
    font-size:20px; color:var(--brand-dark); font-weight:600; z-index:50;
  }

  /* 详情浮层 */
  .overlay{position:fixed; inset:0; background:rgba(23,32,45,.42); display:none; z-index:60;
    align-items:flex-start; justify-content:center; padding:40px 18px; overflow:auto}
  .overlay.show{display:flex}
  .panel{background:#fff; border-radius:12px; max-width:880px; width:100%; padding:18px 22px 22px;
    box-shadow:0 12px 40px rgba(20,30,50,.22)}
  .panel h2{font-size:15px; margin:0 0 4px}
  .panel .p-sub{font-size:12.5px; color:var(--muted); margin-bottom:12px; word-break:break-all}
  .panel h3{font-size:13.5px; margin:16px 0 6px; padding-left:8px; border-left:3px solid var(--brand)}
  .panel table{width:100%; border-collapse:collapse; font-size:12.5px}
  .panel th,.panel td{border-bottom:1px solid var(--line); padding:5px 7px; text-align:left}
  .panel th{color:var(--muted); font-weight:500; background:#fafbfd}
  .panel .close{float:right}
  .kv{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12.5px; color:#41505f}
  .kv b{font-weight:600; color:var(--text)}
</style>
</head>
<body>

<header>
  <h1>PM AI Service<span>文档库 · 上传队列 · 智能问答</span></h1>
  <div id="status">正在连接…</div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="side-block">
      <div class="side-head">
        <b>上传</b>
        <button class="primary" id="uploadBtn">选择文件</button>
        <input type="file" id="fileInput" hidden
               accept=".pdf,.png,.jpg,.jpeg,.bmp,.tif,.tiff,.webp" multiple>
      </div>
      <div class="side-hint">
        可一次选多个、也可把文件拖到页面上。解析在后台进行，<b>关掉页面也不会白跑</b>，
        回来还能看到进度与过程明细。
      </div>
    </div>

    <div class="side-block" style="flex:1;min-height:0">
      <div class="side-head"><b>上传队列</b><span class="meta" id="queueMeta"></span></div>
      <div class="queue" id="queue"></div>
    </div>

    <div class="side-block" style="flex:1.4;min-height:0;border-bottom:none">
      <div class="side-head">
        <b>文档库</b>
        <button class="ghost" id="reloadDocs">刷新</button>
      </div>
      <div class="side-hint" id="docCount">加载中…</div>
      <div class="doc-list" id="docList"></div>
    </div>
  </aside>

  <section class="chat">
    <div class="messages" id="messages">
      <div class="empty" id="emptyTip">
        ① 左侧上传文件（可多选）→ ② 等队列跑完 → ③ 在这里提问。<br>
        例如："付款条款是怎么约定的？各期比例和金额是多少？"
      </div>
    </div>
    <div class="composer">
      <div class="composer-inner">
        <div class="quick">
          <span class="lbl">快捷提问：</span>
          <button data-q="这份文件的主要内容是什么？请分要点总结。">总结主要内容</button>
          <button data-q="列出文件中所有的金额、比例、日期，并标注来源页码。">提取关键数字</button>
          <button data-q="文件里涉及哪些单位和人员？各自承担什么角色？">相关方与人员</button>
          <button data-q="付款条款是怎么约定的？各期比例、金额、条件与时间分别是什么？">付款条款</button>
        </div>
        <div class="input-row">
          <textarea id="question" rows="1" placeholder="就文档内容提问…（Enter 发送，Shift+Enter 换行）"></textarea>
          <button class="send" id="sendBtn">发送</button>
        </div>
      </div>
    </div>
  </section>
</div>

<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div>

<script>
/* ── 引导：确定后端地址并加载渲染库 ───────────────────────────────
   本页可能不在 AI 服务的源上（IDE 预览、本地打开文件），此时相对路径会 404，
   所以先判定后端地址，再从同一地址加载 marked。                      */
(function bootstrap() {
  var sameOrigin = location.protocol.indexOf('http') === 0 && location.port === '8100';
  var api = sameOrigin ? location.origin : 'http://127.0.0.1:8100';
  window.API_BASE = api;

  var started = false;
  function start() { if (!started) { started = true; main(); } }

  var s = document.createElement('script');
  s.src = api + '/static/marked.min.js';
  s.onload = start;
  s.onerror = start;      // 拿不到渲染库也要能用，降级为纯文本
  document.head.appendChild(s);
  setTimeout(start, 6000);
})();

function main() {
  const API = window.API_BASE;
  const $ = id => document.getElementById(id);
  const status = $('status'), docList = $('docList'), docCount = $('docCount');
  const messages = $('messages'), emptyTip = $('emptyTip');
  const question = $('question'), sendBtn = $('sendBtn'), fileInput = $('fileInput');
  const queueEl = $('queue'), queueMeta = $('queueMeta');
  const overlay = $('overlay'), panel = $('panel');

  if (window.marked) marked.setOptions({ gfm: true, breaks: true });

  let docs = [];                 // 文档库
  let selected = new Set();      // 选中的 doc_id（限定提问范围）
  let history = [];              // 发送给后端的纯文本历史
  let busy = false;
  let tasks = [];                // 上传任务
  let expanded = new Set();      // 展开了哪几个任务
  let taskDetail = {};           // task_id → 详情（页级明细）
  let doneCount = -1;            // 已完成任务数（用于判断要不要刷新文档库）

  // ── 服务状态 ──────────────────────────────────────────────
  function loadHealth() {
    status.innerHTML = `正在连接 ${API} …`;
    fetch(API + '/health').then(r => r.json()).then(d => {
      const c = d.config || {}, ocr = d.ocr || {};
      // 本地引擎已于 2026-09-18 移除，服务端 provider 恒为 platform（不再有 auto/回落）
      const provider = d.provider || 'platform';
      const label = { platform: '平台 OCR（PaddleOCR-VL）' }[provider] || provider;
      const ocrLine = provider === 'platform'
        ? `识别引擎：${label}${ocr.workers ? `（空闲 ${ocr.idle ?? '-'}/${ocr.workers}）` : ''}`
        : `<span style="color:#a3231b">识别引擎：${label}${ocr.ok ? '' : '（平台 OCR 不可用：' + escapeHtml(ocr.detail || '') + '）'}</span>`;
      status.innerHTML = `<div class="ok">服务正常 · 模型 ${escapeHtml(c.llm_model || '-')}</div>`
        + `<small>${ocrLine}</small>`;
    }).catch(() => {
      status.innerHTML = `<div class="bad">连不上服务（${API}）</div>`;
      addNotice(`连不上 AI 服务：${API}<br>① 确认容器在运行（ai-service/ 下 <code>docker compose up -d</code>）；`
        + `② 也可直接打开 <a href="${API}/" target="_blank">${API}/</a>。`, 'bad', true);
    });
  }

  // ── 上传队列 ──────────────────────────────────────────────
  async function loadQueue() {
    try {
      const r = await fetch(API + '/upload-tasks');
      const j = await r.json();
      tasks = j.data || [];
    } catch { return; }
    renderQueue();
    const done = tasks.filter(t => t.status === 'DONE').length;
    if (done !== doneCount) { doneCount = done; loadDocs(); }
  }

  function renderQueue() {
    const active = tasks.filter(t => t.status === 'QUEUED' || t.status === 'PARSING').length;
    queueMeta.textContent = tasks.length ? `${tasks.length} 条` + (active ? ` · 进行中 ${active}` : '') : '';
    if (!tasks.length) {
      queueEl.innerHTML = '<div class="empty" style="padding:18px 6px;font-size:12px">暂无上传任务</div>';
      return;
    }
    queueEl.innerHTML = tasks.map(t => {
      const st = t.status;
      const cls = st === 'DONE' ? 'done' : st === 'FAILED' ? 'failed'
                : (st === 'PARSING' || st === 'QUEUED') ? 'running' : '';
      const badge = st === 'DONE' ? '<span class="badge ok">完成</span>'
                  : st === 'FAILED' ? '<span class="badge bad">失败</span>'
                  : st === 'CANCELLED' ? '<span class="badge">已取消</span>'
                  : '<span class="badge run">' + escapeHtml(t.stage || '排队中') + '</span>';
      const pct = st === 'DONE' ? 100 : (st === 'FAILED' || st === 'CANCELLED') ? 100 : (t.percent || 0);
      const pages = t.stage_total ? ` · ${t.stage_done}/${t.stage_total} 页` : '';
      const size = t.size_bytes ? (t.size_bytes / 1024 / 1024).toFixed(2) + ' MB' : '';
      const actions = (st === 'PARSING' || st === 'QUEUED')
        ? `<button class="ghost" data-act="cancel" data-id="${t.task_id}">取消</button>`
        : `<button class="ghost" data-act="remove" data-id="${t.task_id}">移除</button>`;
      const open = expanded.has(t.task_id);
      let more = '';
      if (open) {
        const d = taskDetail[t.task_id];
        more = d ? renderTaskDetail(d) : '<div class="qmore">加载明细…</div>';
      }
      return `
      <div class="qtask ${cls}">
        <div class="top">
          <div class="fname">${escapeHtml(t.filename)}</div>${badge}
        </div>
        <div class="row2"><span>${escapeHtml(t.stage || '')}${pages}</span><span>${size}${t.elapsed ? ' · ' + t.elapsed + 's' : ''}</span></div>
        <div class="bar"><i style="width:${Math.max(2, pct)}%"></i></div>
        ${t.error ? `<div class="qmore err">${escapeHtml(t.error)}</div>` : ''}
        <div class="row2" style="margin-top:6px">
          <button class="ghost" data-act="toggle" data-id="${t.task_id}">${open ? '收起明细' : '过程明细'}</button>
          <span>${actions}</span>
        </div>
        ${more}
      </div>`;
    }).join('');

    queueEl.querySelectorAll('[data-act]').forEach(btn => {
      btn.addEventListener('click', async e => {
        e.stopPropagation();
        const id = btn.dataset.id, act = btn.dataset.act;
        if (act === 'toggle') {
          expanded.has(id) ? expanded.delete(id) : expanded.add(id);
          if (expanded.has(id) && !taskDetail[id]) await loadTaskDetail(id);
          renderQueue();
        } else if (act === 'cancel') {
          await fetch(API + '/upload-tasks/' + id, { method: 'DELETE' });
          loadQueue();
        } else if (act === 'remove') {
          await fetch(API + '/upload-tasks/' + id + '?remove=true', { method: 'DELETE' });
          expanded.delete(id); delete taskDetail[id];
          loadQueue();
        }
      });
    });
  }

  async function loadTaskDetail(id) {
    try {
      const r = await fetch(API + '/upload-tasks/' + id);
      const j = await r.json();
      taskDetail[id] = j.data;
    } catch { /* 忽略：下次展开再试 */ }
  }

  function renderTaskDetail(d) {
    const parts = [];
    const kv = [];
    if (d.provider) kv.push(`<span>识别引擎 <b>${escapeHtml(d.provider)}</b></span>`);
    if (d.stages && Object.keys(d.stages).length) {
      kv.push('<span>耗时：' + Object.entries(d.stages)
        .map(([k, v]) => `${({ render: '渲染', ocr: '识别', check: '校验' }[k] || k)} ${v}s`).join(' / ') + '</span>');
    }
    if (kv.length) parts.push(`<div class="kv">${kv.join('')}</div>`);

    (d.notes || []).forEach(n => parts.push(`<div class="qmore" style="border:none;color:#7a5200">⚠️ ${escapeHtml(n)}</div>`));

    // 确定性校验（最硬的一层证据）
    const checks = d.checks || [];
    if (checks.length) {
      const rows = checks.map(c => {
        const b = c.status === 'pass' ? '<span class="badge ok">通过</span>'
                : c.status === 'fail' ? '<span class="badge bad">不一致</span>'
                : c.status === 'warn' ? '<span class="badge warn">需留意</span>'
                : '<span class="badge">未适用</span>';
        const items = (c.items || []).filter(i => i.status !== 'pass')
          .slice(0, 6).map(i => `<div style="color:#7a5200">· ${escapeHtml(i.detail)}</div>`).join('');
        return `<tr><td>${escapeHtml(c.name)}</td><td>${b}</td><td>${escapeHtml(c.detail || '')}${items}</td></tr>`;
      }).join('');
      parts.push(`<div style="margin-top:6px"><b style="font-size:11.5px">数据校验（可复现）</b>
        <table><tbody>${rows}</tbody></table></div>`);
    }

    // 页级明细 = 过程性内容
    const pages = d.pages || [];
    if (pages.length) {
      const rows = pages.map(p => {
        const flags = [];
        if (p.tables) flags.push('表格' + p.tables);
        if (p.seals) flags.push('印章' + p.seals);
        if (p.empty) flags.push('<span style="color:#a3231b">空白</span>');
        if (p.error) flags.push('<span style="color:#a3231b">失败</span>');
        if (p.note) flags.push('<span style="color:#7a5200">降级</span>');
        return `<tr><td>P${p.page_no}</td><td>${p.chars} 字</td>
          <td>${p.elapsed != null ? p.elapsed + 's' : '-'}</td>
          <td>${escapeHtml(p.source || '')}</td>
          <td>${flags.join(' ') || '-'}</td></tr>`;
      }).join('');
      parts.push(`<div style="margin-top:6px"><b style="font-size:11.5px">逐页明细</b>
        <table><thead><tr><th>页</th><th>字数</th><th>耗时</th><th>来源</th><th>标记</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`);
    }
    return `<div class="qmore">${parts.join('') || '（无明细）'}</div>`;
  }

  // ── 上传（真正的修复点：不再用单例提示互相覆盖）─────────────
  $('uploadBtn').addEventListener('click', () => fileInput.click());
  fileInput.addEventListener('change', async e => {
    const files = [...e.target.files];
    fileInput.value = '';
    if (files.length) await upload(files);
  });

  async function upload(files) {
    const form = new FormData();
    for (const f of files) form.append('files', f);
    try {
      const resp = await fetch(API + '/upload-tasks', { method: 'POST', body: form });
      const json = await resp.json();
      if (!resp.ok || json.code !== 0) throw new Error(json.detail || `HTTP ${resp.status}`);
      (json.data || []).forEach(t => expanded.add(t.task_id));
      await loadQueue();
      (json.data || []).forEach(t => loadTaskDetail(t.task_id).then(renderQueue));
    } catch (err) {
      addNotice(`<b>上传失败</b>：${escapeHtml(String(err.message || err))}`, 'bad');
    }
  }

  // 拖拽上传（原来的界面只能点按钮）
  let dragDepth = 0;
  window.addEventListener('dragenter', e => {
    if (!e.dataTransfer || [...(e.dataTransfer.types || [])].indexOf('Files') < 0) return;
    dragDepth++; document.body.classList.add('dragging');
  });
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
  window.addEventListener('drop', async e => {
    e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
    const files = [...(e.dataTransfer ? e.dataTransfer.files : [])];
    if (files.length) await upload(files);
  });

  // ── 文档库 ────────────────────────────────────────────────
  $('reloadDocs').addEventListener('click', loadDocs);

  async function loadDocs() {
    try {
      const r = await fetch(API + '/documents');
      const j = await r.json();
      docs = j.data || [];
    } catch { docCount.textContent = '读取文档库失败'; return; }
    const ids = new Set(docs.map(x => x.doc_id));
    selected = new Set([...selected].filter(id => ids.has(id)));
    renderDocs();
  }

  function checkBadge(sum) {
    if (!sum) return '';
    if (sum.fail) return `<span class="badge bad">校验 ${sum.fail} 项不一致</span>`;
    if (sum.warn) return `<span class="badge warn">校验 ${sum.warn} 项需留意</span>`;
    if (sum.pass) return `<span class="badge ok">校验通过</span>`;
    return '';
  }

  function renderDocs() {
    docCount.innerHTML = docs.length
      ? `共 ${docs.length} 份` + (selected.size ? ` · 已选 ${selected.size} 份` : '（未选＝检索全部）')
      : '还没有文档——先在左侧上传';
    if (!docs.length) {
      docList.innerHTML = '<div class="empty" style="padding:22px 6px;font-size:12px">暂无文档</div>';
      return;
    }
    docList.innerHTML = docs.map(d => {
      const engine = d.provider || d.engine || '';
      const engineText = { platform: '平台 OCR', 'text-layer': '文本层' }[engine] || engine;
      const review = (d.review_pages || []).length ? ` · <span style="color:#a3231b">待复核 ${d.review_pages.join(',')} 页</span>` : '';
      return `
      <div class="doc-item ${selected.has(d.doc_id) ? 'on' : ''}" data-id="${d.doc_id}">
        <div class="tools">
          <button data-info="${d.doc_id}" title="解析明细与数据校验">ⓘ</button>
          <button class="del" data-del="${d.doc_id}" title="删除">×</button>
        </div>
        <div class="name">${escapeHtml(d.filename)}</div>
        <div class="sub">
          ${d.pages} 页 · ${d.chars} 字 · ${escapeHtml(engineText)}<br>
          ${checkBadge(d.check_summary)}${review}
        </div>
      </div>`;
    }).join('');

    docList.querySelectorAll('.doc-item').forEach(el => {
      el.addEventListener('click', e => {
        if (e.target.closest('[data-del]') || e.target.closest('[data-info]')) return;
        const id = el.dataset.id;
        selected.has(id) ? selected.delete(id) : selected.add(id);
        renderDocs();
      });
    });
    docList.querySelectorAll('[data-del]').forEach(btn => {
      btn.addEventListener('click', async e => {
        e.stopPropagation();
        const id = btn.dataset.del;
        const doc = docs.find(x => x.doc_id === id);
        if (!confirm(`删除「${doc ? doc.filename : id}」？`)) return;
        await fetch(API + '/documents/' + id, { method: 'DELETE' });
        loadDocs();
      });
    });
    docList.querySelectorAll('[data-info]').forEach(btn => {
      btn.addEventListener('click', async e => {
        e.stopPropagation();
        openDocDetail(btn.dataset.info);
      });
    });
  }

  // ── 文档详情（出处 / 校验 / 逐页明细）──────────────────────
  async function openDocDetail(docId) {
    panel.innerHTML = '<div class="empty" style="padding:24px">加载中…</div>';
    overlay.classList.add('show');
    try {
      const r = await fetch(API + '/documents/' + docId);
      const j = await r.json();
      if (!j.data) throw new Error(j.detail || '文档不存在');
      renderDocDetail(j.data);
    } catch (err) {
      panel.innerHTML = `<div class="empty" style="padding:24px">读取失败：${escapeHtml(String(err.message || err))}</div>`;
    }
  }

  function renderDocDetail(d) {
    const engine = d.provider || d.engine || '';
    const kv = [
      `${d.pages} 页 · ${d.chars} 字`,
      `识别引擎 <b>${escapeHtml(engine || '-')}</b>`,
      d.image_format ? `图像 ${d.image_format}${d.dpi ? ' / ' + d.dpi + 'dpi' : ''}` : '',
      d.avg_confidence != null ? `识别置信度 ${d.avg_confidence}` : '（该引擎不提供逐页置信度）',
    ].filter(Boolean);

    const stageRows = Object.entries(d.stages || {})
      .map(([k, v]) => `<tr><td>${({ render: '渲染页面', ocr: 'OCR 识别', check: '数据校验' }[k] || k)}</td><td>${v}s</td></tr>`).join('');

    const checkRows = (d.checks || []).map(c => {
      const b = c.status === 'pass' ? '<span class="badge ok">通过</span>'
              : c.status === 'fail' ? '<span class="badge bad">不一致</span>'
              : c.status === 'warn' ? '<span class="badge warn">需留意</span>'
              : '<span class="badge">未适用</span>';
      const items = (c.items || []).map(i => {
        const tag = i.page ? `P${i.page} ` : '';
        const color = i.status === 'pass' ? '#0b7a44' : i.status === 'fail' ? '#a3231b' : '#7a5200';
        return `<div style="font-size:12px;color:${color}">· ${tag}${escapeHtml(i.detail)}</div>`;
      }).join('');
      return `<tr><td style="white-space:nowrap">${escapeHtml(c.name)}</td><td>${b}</td>
        <td>${escapeHtml(c.detail || '')}${items}</td></tr>`;
    }).join('');

    const pageRows = (d.page_quality || []).map(p => {
      const flags = [];
      if (p.tables) flags.push('表格 ' + p.tables);
      if (p.seals) flags.push('印章 ' + p.seals);
      if (p.empty) flags.push('<span style="color:#a3231b">空白</span>');
      if (p.error) flags.push('<span style="color:#a3231b">失败</span>');
      if (p.note) flags.push('<span style="color:#7a5200">降级</span>');
      return `<tr><td>P${p.page_no}</td><td>${p.chars}</td><td>${p.elapsed != null ? p.elapsed + 's' : '-'}</td>
        <td>${escapeHtml(p.source || '')}</td><td>${p.confidence != null ? p.confidence : '-'}</td>
        <td>${flags.join(' ') || '-'}</td></tr>`;
    }).join('');

    panel.innerHTML = `
      <button class="ghost close" onclick="document.getElementById('overlay').classList.remove('show')">关闭</button>
      <h2>${escapeHtml(d.filename)}</h2>
      <div class="p-sub">${kv.join(' · ')}</div>
      ${(d.notes || []).map(n => `<div class="notice" style="margin:8px 0">${escapeHtml(n)}</div>`).join('')}
      <h3>耗时分解</h3>
      <table><tbody>${stageRows || '<tr><td>（无）</td><td></td></tr>'}</tbody></table>
      <h3>数据校验（代码算的，可复现）</h3>
      <table><tbody>${checkRows || '<tr><td colspan="3">（无）</td></tr>'}</tbody></table>
      <h3>逐页明细</h3>
      <table><thead><tr><th>页</th><th>字数</th><th>耗时</th><th>来源</th><th>置信度</th><th>标记</th></tr></thead>
      <tbody>${pageRows || '<tr><td colspan="6">（无）</td></tr>'}</tbody></table>
      <div class="p-sub" style="margin-top:12px">
        说明：出处＝页码，若该页带表格/印章会在标记列显示；<b>置信度</b>是识别层分数，
        平台 OCR 不提供（因为实测它在错误内容上也会给高分）；判断内容对不对请结合上面的<b>数据校验</b>。
      </div>`;
  }

  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('show'); });

  // ── 问答 ─────────────────────────────────────────────────
  async function ask(text) {
    text = (text || '').trim();
    if (busy || !text) return;
    busy = true; sendBtn.disabled = true;
    if (emptyTip) emptyTip.style.display = 'none';

    appendMsg('user', text);
    history.push({ role: 'user', content: text });
    question.value = ''; question.style.height = 'auto';

    const pending = appendPending();
    try {
      const resp = await fetch(API + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          question: text,
          doc_ids: selected.size ? [...selected] : null,
          history: history.slice(-12),
        }),
      });
      const json = await resp.json();
      if (!resp.ok || json.code !== 0) throw new Error(json.detail || `HTTP ${resp.status}`);
      pending.remove();
      renderAnswer(json.data);
      history.push({ role: 'assistant', content: json.data.answer || '' });
    } catch (err) {
      pending.remove();
      appendMsg('bot', `> ⚠️ 请求失败：${escapeHtml(String(err.message || err))}`);
    } finally {
      busy = false; sendBtn.disabled = false;
      messages.scrollTop = messages.scrollHeight;
    }
  }

  function appendMsg(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + (role === 'user' ? 'user' : 'bot');
    const who = role === 'user' ? { icon: '👤', label: '你' } : { icon: '🤖', label: '分析助手' };
    div.innerHTML = `
      <div class="avatar">${who.icon}</div>
      <div class="body">
        <div class="who">${who.label}</div>
        <div class="bubble">${role === 'user' ? escapeHtml(text) : renderMd(text)}</div>
      </div>`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  function appendPending() {
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="body">
        <div class="who">分析助手</div>
        <div class="bubble"><span class="spin"></span>正在检索文档并分析…
          （模型会自行调用检索 / 计算工具，可能需要几十秒）</div>
      </div>`;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  function renderAnswer(data) {
    const llm = data.llm || {};
    const trace = data.trace || [];
    const div = document.createElement('div');
    div.className = 'msg bot';

    let traceHtml = '';
    if (trace.length) {
      const items = trace.map(t => `
        <div class="item ${t.is_error ? 'err' : ''}">
          <code>${escapeHtml(t.name)}</code>
          ${escapeHtml(JSON.stringify(t.arguments))} → ${escapeHtml(t.brief)}
          <span style="color:#9aa5b1">(${t.elapsed}s)</span>
        </div>`).join('');
      traceHtml = `<details class="trace">
        <summary>模型调用工具 ${trace.length} 次 · 共 ${llm.rounds || '-'} 轮 · 耗时 ${llm.elapsed || '-'}s</summary>
        ${items}</details>`;
    }

    const scope = (data.scope || []).map(s => escapeHtml(s.filename)).join('、');
    div.innerHTML = `
      <div class="avatar">🤖</div>
      <div class="body">
        <div class="who">分析助手${scope ? `　· 检索范围：${scope}` : ''}</div>
        ${traceHtml}
        <div class="bubble"><div class="markdown">${renderMd(data.answer || '')}</div></div>
      </div>`;
    messages.appendChild(div);

    div.querySelectorAll('.markdown').forEach(root => {
      root.querySelectorAll('td, li, p, blockquote, h3').forEach(el => {
        if (/\[[^\]]*P\d+[^\]]*\]/.test(el.innerHTML)) {
          el.innerHTML = el.innerHTML.replace(/\[([^\]]*P\d+[^\]]*)\]/g,
            '<span class="src">$1</span>');
        }
      });
    });
    messages.scrollTop = messages.scrollHeight;
    loadHealth();
  }

  function renderMd(text) {
    return window.marked
      ? sanitize(marked.parse(text))
      : '<pre style="white-space:pre-wrap;font:inherit">' + escapeHtml(text) + '</pre>';
  }

  // 模型输出属不可信内容，做基本清理（内网自用，仍避免脚本注入）
  function sanitize(html) {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('script,style,iframe,object,embed,link,meta,form,base')
      .forEach(n => n.remove());
    doc.querySelectorAll('*').forEach(el => {
      [...el.attributes].forEach(a => {
        if (/^on/i.test(a.name)) el.removeAttribute(a.name);
        if ((a.name === 'href' || a.name === 'src') && /^\s*javascript:/i.test(a.value)) {
          el.removeAttribute(a.name);
        }
      });
    });
    return doc.body.innerHTML;
  }

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // 问答区的一次性提示（与上传队列分开，不再互相顶掉）
  let noticeTimer = null;
  function addNotice(html, kind, sticky) {
    const old = $('notice'); if (old) old.remove();
    clearTimeout(noticeTimer);
    const div = document.createElement('div');
    div.className = 'notice' + (kind ? ' ' + kind : '');
    div.id = 'notice';
    div.innerHTML = html;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    if (!sticky) noticeTimer = setTimeout(() => { const n = $('notice'); if (n) n.remove(); }, 8000);
  }

  // ── 输入 ─────────────────────────────────────────────────
  sendBtn.addEventListener('click', () => ask(question.value));
  question.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(question.value); }
  });
  question.addEventListener('input', () => {
    question.style.height = 'auto';
    question.style.height = Math.min(question.scrollHeight, 150) + 'px';
  });
  document.querySelectorAll('.quick button').forEach(b => {
    b.addEventListener('click', () => ask(b.dataset.q));
  });

  // ── 轮询：队列 1.5s（有进行中任务）/ 5s（空闲）────────────
  function poll() {
    loadQueue().finally(() => {
      const active = tasks.some(t => t.status === 'QUEUED' || t.status === 'PARSING');
      if (active) {
        // 展开中的任务同步刷新页级明细
        expanded.forEach(id => {
          const t = tasks.find(x => x.task_id === id);
          if (t && (t.status === 'PARSING' || t.status === 'QUEUED')) {
            loadTaskDetail(id).then(() => { if (expanded.has(id)) renderQueue(); });
          }
        });
      }
      setTimeout(poll, active ? 1500 : 5000);
    });
  }

  loadHealth();
  loadDocs();
  loadQueue().then(() => setTimeout(poll, 1500));
}
</script>
</body>
</html>
